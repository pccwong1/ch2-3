<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會計等式互動遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        primary: '#6d28d9',
                        secondary: '#4c1d95',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .slide-in { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .correct-answer { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .wrong-answer { background-color: #ef4444 !important; color: white !important; border-color: #ef4444 !important; }
        .difficulty-btn.active { background-color: #6d28d9; color: white; border-color: #6d28d9; }
        button:active { transform: scale(0.98); }
        @media print {
            body > div > *:not(#resultsScreen) { display: none; }
            #resultsScreen { display: block !important; }
            #printable-results { box-shadow: none !important; border: none !important; }
            #action-buttons { display: none; }
        }
    </style>
</head>

            for (let i = array.length - 1; i > 0; i--) {

        }
        function renderQuestion() {
            const container = document.getElementById('questionContainer');
            container.innerHTML = '';
            // 1. Account Selection
            container.innerHTML += createSelectionSection('會計科目 / 帳戶名稱', 'account', accountOptions);
            
            // 2. Type Selection
            container.innerHTML += createSelectionSection('帳戶類型', 'type', typeOptions);
            
            // 3. Effect Selection
            container.innerHTML += createSelectionSection('影響方向', 'effect', effectOptions, true);
            
            // 4. Debit/Credit Selection
            container.innerHTML += createSelectionSection('借方 / 貸方', 'debitCredit', debitCreditOptions, true);
        }
        function createSelectionSection(title, type, options, isObject = false) {
            let buttonsHtml = '';
            
            options.forEach(opt => {
                const value = isObject ? opt.value : opt;
                const label = isObject ? opt.label : opt;
                
                buttonsHtml += `
                    <button
                        onclick="selectOption('${type}', '${value}', this)"
                        data-question="${type}"
                        data-value="${value}"
                        class="p-3 rounded-lg border-2 border-gray-200 dark:border-gray-700 hover:border-primary hover:bg-purple-50 dark:hover:bg-gray-700 transition-all text-sm md:text-base font-medium"
                    >
                        ${label}
                    </button>
                `;
            });
            return `
                <div class="bg-white dark:bg-gray-900 p-4 rounded-lg shadow-sm border border-gray-100 dark:border-gray-800">
                    <h3 class="font-bold mb-3 text-base md:text-lg text-gray-800 dark:text-gray-200">${title}：</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                        ${buttonsHtml}
                    </div>
                </div>
            `;
        }
        function selectOption(type, value, btnElement) {
            if (document.getElementById('submitBtn').disabled) return;
            userAnswers[type] = value;
            
            // Visual feedback
            const parent = btnElement.parentElement;
            parent.querySelectorAll('button').forEach(b => {
                b.classList.remove('bg-primary', 'text-white', 'border-primary');
                b.classList.add('border-gray-200', 'dark:border-gray-700');
            });
            
            btnElement.classList.add('bg-primary', 'text-white', 'border-primary');
            btnElement.classList.remove('border-gray-200', 'dark:border-gray-700');
        }
        function checkAnswer() {
            // Validate all selected
            if (!userAnswers.account || !userAnswers.type || !userAnswers.effect || !userAnswers.debitCredit) {
                showCustomAlert('請完成所有選項！');
                return;
            }
            const transaction = currentQuestions[currentQuestionIndex];
            let isCorrect = false;
            let matchedEntry = null;
            
            const expectedEntry = transaction.entries[currentEntryIndex];
            
            // Check exact match with expected entry
            if (userAnswers.account === expectedEntry.account &&
                userAnswers.type === expectedEntry.type &&
                userAnswers.effect === expectedEntry.effect &&
                userAnswers.debitCredit === expectedEntry.debitCredit) {
                isCorrect = true;
                matchedEntry = expectedEntry;
            }
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.classList.remove('hidden', 'bg-green-100', 'bg-red-100', 'dark:bg-green-900', 'dark:bg-red-900', 'text-green-800', 'text-red-800', 'dark:text-green-100', 'dark:text-red-100');
            if (isCorrect) {
                score++;
                feedbackEl.textContent = '🎉 答對了！繼續保持！';
                feedbackEl.classList.add('bg-green-100', 'dark:bg-green-900', 'text-green-800', 'dark:text-green-100');
            } else {
                feedbackEl.innerHTML = `
                    ❌ 答錯了。<br>
                    正確答案應為：<br>
                    帳戶: ${expectedEntry.account} | 類型: ${expectedEntry.type} |
                    影響: ${expectedEntry.effect === 'increase' ? '增加' : '減少'} |
                    ${expectedEntry.debitCredit === 'debit' ? '借方' : '貸方'}
                `;
                feedbackEl.classList.add('bg-red-100', 'dark:bg-red-900', 'text-red-800', 'dark:text-red-100');
            }
            // Disable button
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');
            // Highlight Answers
            highlightAnswers(expectedEntry, userAnswers);
            // Delay next
            setTimeout(() => {
                currentEntryIndex++;
                if (currentEntryIndex >= transaction.entries.length) {
                    currentEntryIndex = 0;
                    currentQuestionIndex++;
                }
                loadQuestion();
            }, isCorrect ? 2000 : 4000); // Longer delay for wrong answer to read
        }
        function highlightAnswers(correctEntry, userAnswers) {
            ['account', 'type', 'effect', 'debitCredit'].forEach(key => {
                const correctVal = correctEntry[key];
                const userVal = userAnswers[key];
                // Highlight correct button
                const correctBtn = document.querySelector(`[data-question="${key}"][data-value="${correctVal}"]`);
                if (correctBtn) correctBtn.classList.add('correct-answer');
                // Highlight wrong user selection
                if (userVal && userVal !== correctVal) {
                    const wrongBtn = document.querySelector(`[data-question="${key}"][data-value="${userVal}"]`);
                    if (wrongBtn) wrongBtn.classList.add('wrong-answer');
                }
            });
        }
        function endGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('progressContainer').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalTotal').textContent = totalEntries;
            const percentage = (score / totalEntries) * 100;
            let message = '';
            let emoji = '';
            if (percentage >= 90) {
                message = '太棒了！你是會計大師！ 🌟';
                emoji = '👑';
            } else if (percentage >= 70) {
                message = '做得很好！基礎很紮實！';
                emoji = '🌟';
            } else if (percentage >= 50) {
                message = '不錯！多練習會更熟練！';
                emoji = '👍';
            } else {
                message = '繼續努力！建議複習會計等式的基本概念。';
                emoji = '📚';
            }
            document.getElementById('performanceMessage').textContent = message;
            document.getElementById('endEmoji').textContent = emoji;
        }
        function restartGame() {
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }
        function showCustomAlert(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
            alertDiv.innerHTML = `
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg max-w-sm w-full slide-in">
                    <p class="text-gray-700 dark:text-gray-300 mb-6 text-lg font-medium text-center">${message}</p>
                    <button class="w-full px-4 py-3 bg-primary text-white hover:bg-purple-700 rounded-lg text-base font-semibold transition-colors" onclick="this.closest('.fixed').remove()">
                        確定
                    </button>
                </div>
            `;
            document.body.appendChild(alertDiv);
        }
    </script>
</body>
</html>
