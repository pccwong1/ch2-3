<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會計等式互動遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        primary: '#6d28d9',
                        secondary: '#4c1d95',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .slide-in { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .correct-answer { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .wrong-answer { background-color: #ef4444 !important; color: white !important; border-color: #ef4444 !important; }
        .difficulty-btn.active { background-color: #6d28d9; color: white; border-color: #6d28d9; }
        button:active { transform: scale(0.98); }
        @media print {
            body > div > *:not(#resultsScreen) { display: none; }
            #resultsScreen { display: block !important; }
            #printable-results { box-shadow: none !important; border: none !important; }
            #action-buttons { display: none; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div class="min-h-screen p-4 md:p-8">
        <div class="max-w-4xl mx-auto mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-center mb-2 text-primary">會計等式互動遊戲</h1>
            <p class="text-center text-gray-600 dark:text-gray-400 text-base md:text-lg">學習交易事項如何影響會計等式</p>
        </div>
        <div id="progressContainer" class="max-w-4xl mx-auto mb-6 hidden">
            <div class="bg-gray-200 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
                <div id="progressBar" class="bg-primary h-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex justify-between mt-2 text-sm text-gray-600 dark:text-gray-400">
                <span>進度 <span id="currentQuestion">0</span>/<span id="totalQuestions">0</span></span>
                <span>分數: <span id="score" class="font-bold text-primary">0</span></span>
            </div>
        </div>

        <div id="startScreen" class="max-w-2xl mx-auto text-center slide-in">
            <div class="bg-gray-50 dark:bg-gray-800 rounded-xl p-8 shadow-lg border border-gray-200 dark:border-gray-700">
                <div class="text-6xl mb-6">📊</div>
                <h2 class="text-2xl font-bold mb-4">準備好學習會計了嗎？</h2>
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-3">遊戲說明：</h3>
                    <ul class="text-left text-gray-600 dark:text-gray-400 space-y-2 max-w-md mx-auto list-none">
                        <li>✓ 選擇難度，挑戰最高100分！</li>
                        <li>✓ 閱讀交易事項，完成所有分錄。</li>
                    </ul>
                </div>
                <div class="mb-8">
                    <label class="block text-base font-semibold mb-3">選擇難度 (滿分均為100分):</label>
                    <div id="difficulty-selection" class="flex gap-3 justify-center flex-wrap">
                        <button data-difficulty="easy" class="difficulty-btn px-6 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 transition-all text-base">
                            簡單 (10 題)
                        </button>
                        <button data-difficulty="medium" class="difficulty-btn px-6 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 transition-all text-base">
                            中等 (5 題)
                        </button>
                        <button data-difficulty="hard" class="difficulty-btn px-6 py-3 rounded-lg border-2 border-primary bg-primary text-white transition-all text-base active">
                            困難 (2 題)
                        </button>
                    </div>
                </div>
                <button id="startGameBtn" class="bg-primary hover:bg-purple-700 text-white font-bold py-4 px-8 rounded-lg text-lg transition-all transform hover:scale-105 shadow-md w-full md:w-auto">
                    開始遊戲
                </button>
            </div>
        </div>

        <div id="gameScreen" class="max-w-4xl mx-auto hidden slide-in">
            <div class="bg-gray-50 dark:bg-gray-800 rounded-xl p-6 md:p-8 shadow-lg border border-gray-200 dark:border-gray-700">
                <div class="mb-6 p-4 bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-600">
                    <div class="text-sm text-gray-500 dark:text-gray-400 mb-1">交易事項:</div>
                    <div id="transactionText" class="text-xl md:text-2xl font-bold text-primary"></div>
                </div>
                <div id="entryIndicator" class="mb-4 text-base font-semibold text-gray-600 dark:text-gray-300"></div>
                <div id="questionContainer" class="space-y-6"></div>
                <div id="feedback" class="mt-6 p-4 rounded-lg hidden text-center font-bold text-lg"></div>
                <div class="mt-8 text-center">
                    <button id="submitBtn" class="bg-primary hover:bg-purple-700 text-white font-bold py-3 px-12 rounded-lg text-lg transition-all transform hover:scale-105 shadow-md w-full md:w-auto">
                        提交答案
                    </button>
                </div>
            </div>
        </div>

        <div id="resultsScreen" class="max-w-2xl mx-auto text-center hidden">
            <div id="printable-results" class="bg-white dark:bg-gray-800 rounded-xl p-8 shadow-lg border border-gray-200 dark:border-gray-700">
                <h2 class="text-3xl font-bold mb-4 text-gray-800 dark:text-gray-200">成績報告</h2>
                <p class="text-lg text-gray-600 dark:text-gray-400 mb-6">會計等式互動遊戲</p>
                <div id="endEmoji" class="text-6xl mb-4"></div>
                <div class="text-5xl font-bold text-primary mb-2">
                    <span id="finalScore">0</span> / <span id="finalTotal">100</span>
                </div>
                <div class="text-2xl text-gray-700 dark:text-gray-300 mb-6">
                    答對率: <span id="accuracy">0</span>%
                </div>
                <div id="performanceMessage" class="text-xl mb-8 text-gray-600 dark:text-gray-400 font-medium"></div>
                <div id="action-buttons" class="space-y-4 md:space-y-0 md:space-x-4">
                    <button id="printBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all transform hover:scale-105 shadow-md">
                        🖨️ 列印報告
                    </button>
                    <button id="restartBtn" class="bg-primary hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all transform hover:scale-105 shadow-md">
                        🔄 再玩一次
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FULL_MARKS = 100;
        const transactions = [
            { id: 'a', text: '3月8日東主投入現金$10,000', entries: [{ account: '現金', type: '資產', effect: 'increase', debitCredit: 'debit' }, { account: '資本', type: '資本', effect: 'increase', debitCredit: 'credit' }] },
            { id: 'b', text: '3月9日東主投入辦公室設備$20,000', entries: [{ account: '辦公室設備', type: '資產', effect: 'increase', debitCredit: 'debit' }, { account: '資本', type: '資本', effect: 'increase', debitCredit: 'credit' }] },
            { id: 'c', text: '3月10日賒購貨品$5,000', entries: [{ account: '購貨', type: '費用', effect: 'increase', debitCredit: 'debit' }, { account: '應付貨款', type: '負債', effect: 'increase', debitCredit: 'credit' }] },
            { id: 'd', text: '3月12日賒銷貨品$8,000', entries: [{ account: '應收貨款', type: '資產', effect: 'increase', debitCredit: 'debit' }, { account: '銷貨', type: '收益', effect: 'increase', debitCredit: 'credit' }] },
            { id: 'e', text: '3月15日以現金支付租金$1,000', entries: [{ account: '租金', type: '費用', effect: 'increase', debitCredit: 'debit' }, { account: '現金', type: '資產', effect: 'decrease', debitCredit: 'credit' }] },
            { id: 'f', text: '3月18日收到佣金收入$500', entries: [{ account: '現金', type: '資產', effect: 'increase', debitCredit: 'debit' }, { account: '佣金收入', type: '收益', effect: 'increase', debitCredit: 'credit' }] },
            { id: 'g', text: '3月20日歸還應付貨款$2,000', entries: [{ account: '應付貨款', type: '負債', effect: 'decrease', debitCredit: 'debit' }, { account: '銀行存款', type: '資產', effect: 'decrease', debitCredit: 'credit' }] },
            { id: 'h', text: '3月22日收到應收貨款$3,000', entries: [{ account: '現金', type: '資產', effect: 'increase', debitCredit: 'debit' }, { account: '應收貨款', type: '資產', effect: 'decrease', debitCredit: 'credit' }] },
            { id: 't', text: '4月19日東主提取貨品$100', entries: [{ account: '提用', type: '提用', effect: 'increase', debitCredit: 'debit' }, { account: '購貨', type: '費用', effect: 'decrease', debitCredit: 'credit' }] },
            { id: 'u', text: '4月20日東主提取辦公室設備$1,000', entries: [{ account: '提用', type: '提用', effect: 'increase', debitCredit: 'debit' }, { account: '辦公室設備', type: '資產', effect: 'decrease', debitCredit: 'credit' }] },
            { id: 'v', text: '4月25日從銀行提取現金$400', entries: [{ account: '現金', type: '資產', effect: 'increase', debitCredit: 'debit' }, { account: '銀行存款', type: '資產', effect: 'decrease', debitCredit: 'credit' }] },
            { id: 'w', text: '4月26日向銀行借款$50,000', entries: [{ account: '現金', type: '資產', effect: 'increase', debitCredit: 'debit' }, { account: '銀行貸款', type: '負債', effect: 'increase', debitCredit: 'credit' }] }
        ];
        const accountOptions = [ '現金', '辦公室設備', '應付貨款', '應收貨款', '資本', '購貨', '銷貨', '銀行存款', '租金', '銀行貸款', '提用', '佣金收入' ];
        const typeOptions = ['資產', '負債', '資本', '收益', '費用', '提用'];
        const effectOptions = [{value: 'increase', label: '增加 ↑'}, {value: 'decrease', label: '減少 ↓'}];
        const debitCreditOptions = [{value: 'debit', label: '借方'}, {value: 'credit', label: '貸方'}];
        
        let selectedDifficulty = 'hard';
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let totalEntriesInGame = 0;
        let pointsPerEntry = 0;
        let userAnswers = { account: null, type: null, effect: null, debitCredit: null };

        function selectDifficulty(difficulty, btnElement) {
            selectedDifficulty = difficulty;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active', 'bg-primary', 'text-white'));
            btnElement.classList.add('active', 'bg-primary', 'text-white');
        }

        function startGame() {
            let shuffled = shuffleArray([...transactions]);
            if (selectedDifficulty === 'easy') {
                currentQuestions = shuffled.slice(0, 10);
                pointsPerEntry = FULL_MARKS / (10 * 2); // 5 marks
            } else if (selectedDifficulty === 'medium') {
                currentQuestions = shuffled.slice(0, 5);
                pointsPerEntry = FULL_MARKS / (5 * 2); // 10 marks
            } else { // hard
                currentQuestions = shuffled.slice(0, 2);
                pointsPerEntry = FULL_MARKS / (2 * 2); // 25 marks
            }
            
            currentQuestions.forEach(q => q.doneEntries = []);
            currentQuestionIndex = 0;
            score = 0;
            totalEntriesInGame = currentQuestions.reduce((sum, q) => sum + q.entries.length, 0);
            
            document.getElementById('totalQuestions').textContent = totalEntriesInGame;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('progressContainer').classList.remove('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            loadQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                endGame();
                return;
            }
            const transaction = currentQuestions[currentQuestionIndex];
            const doneEntriesCount = transaction.doneEntries.length;
            
            document.getElementById('transactionText').textContent = transaction.text;
            document.getElementById('entryIndicator').textContent = `分錄 ${doneEntriesCount + 1}/${transaction.entries.length} (次序不限)`;
            userAnswers = { account: null, type: null, effect: null, debitCredit: null };
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').classList.remove('opacity-50', 'cursor-not-allowed');

            let entriesDone = 0;
            for(let i = 0; i < currentQuestionIndex; i++) entriesDone += currentQuestions[i].entries.length;
            entriesDone += doneEntriesCount;
            
            document.getElementById('currentQuestion').textContent = entriesDone + 1 > totalEntriesInGame ? totalEntriesInGame : entriesDone + 1;
            document.getElementById('score').textContent = Math.round(score);
            document.getElementById('progressBar').style.width = totalEntriesInGame > 0 ? ((entriesDone) / totalEntriesInGame) * 100 + '%' : '0%';

            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('questionContainer');
            container.innerHTML = '';
            container.innerHTML += createSelectionSection('會計科目', 'account', accountOptions);
            container.innerHTML += createSelectionSection('帳戶類型', 'type', typeOptions);
            container.innerHTML += createSelectionSection('影響方向', 'effect', effectOptions, true);
            container.innerHTML += createSelectionSection('借方 / 貸方', 'debitCredit', debitCreditOptions, true);
        }

        function createSelectionSection(title, type, options, isObject = false) {
            let buttonsHtml = options.map(opt => {
                const value = isObject ? opt.value : opt;
                const label = isObject ? opt.label : opt;
                return `<button data-type="${type}" data-value="${value}" class="option-btn p-3 rounded-lg border-2 border-gray-200 dark:border-gray-700 hover:border-primary hover:bg-purple-50 dark:hover:bg-gray-700 transition-all text-sm md:text-base font-medium">${label}</button>`;
            }).join('');
            return `<div class="bg-white dark:bg-gray-900 p-4 rounded-lg shadow-sm"><h3 class="font-bold mb-3 text-base md:text-lg">${title}：</h3><div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2 md:gap-3">${buttonsHtml}</div></div>`;
        }

        function selectOption(type, value, btnElement) {
            if (document.getElementById('submitBtn').disabled) return;
            userAnswers[type] = value;
            // Visually de-select all buttons in the same group before selecting the new one
            btnElement.closest('.grid').querySelectorAll('.option-btn').forEach(b => {
                 if(b.dataset.type === type) {
                    b.classList.remove('bg-primary', 'text-white', 'border-primary');
                }
            });
            btnElement.classList.add('bg-primary', 'text-white', 'border-primary');
        }

        function checkAnswer() {
            if (!userAnswers.account || !userAnswers.type || !userAnswers.effect || !userAnswers.debitCredit) {
                showCustomAlert('請完成所有選項！');
                return;
            }
            const transaction = currentQuestions[currentQuestionIndex];
            let isCorrect = false, matchedEntry = null, matchedEntryIndex = -1;

            for (let i = 0; i < transaction.entries.length; i++) {
                if (transaction.doneEntries.includes(i)) continue;
                const entry = transaction.entries[i];
                if (userAnswers.account === entry.account && userAnswers.type === entry.type && userAnswers.effect === entry.effect && userAnswers.debitCredit === entry.debitCredit) {
                    isCorrect = true; matchedEntry = entry; matchedEntryIndex = i; break;
                }
            }
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.className = 'mt-6 p-4 rounded-lg text-center font-bold text-lg';

            if (isCorrect) {
                score += pointsPerEntry;
                transaction.doneEntries.push(matchedEntryIndex);
                feedbackEl.textContent = `🎉 答對了！ +${pointsPerEntry}分`;
                feedbackEl.classList.add('bg-green-100', 'dark:bg-green-900', 'text-green-800', 'dark:text-green-100');
                highlightAnswers(matchedEntry);
            } else {
                const firstUnansweredIndex = transaction.entries.findIndex((entry, index) => !transaction.doneEntries.includes(index));
                const expectedEntry = transaction.entries[firstUnansweredIndex];
                feedbackEl.innerHTML = `❌ 答錯了。<br>正確答案之一是： ${expectedEntry.account} (${expectedEntry.debitCredit})`;
                feedbackEl.classList.add('bg-red-100', 'dark:bg-red-900', 'text-red-800', 'dark:text-red-100');
                highlightAnswers(expectedEntry);
            }
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');
            setTimeout(() => {
                if (transaction.doneEntries.length >= transaction.entries.length) currentQuestionIndex++;
                loadQuestion();
            }, isCorrect ? 2000 : 4000);
        }

        function highlightAnswers(correctEntry) {
            ['account', 'type', 'effect', 'debitCredit'].forEach(key => {
                const correctVal = correctEntry[key], userVal = userAnswers[key];
                const correctBtn = document.querySelector(`[data-type="${key}"][data-value="${correctVal}"]`);
                if (correctBtn) correctBtn.classList.add('correct-answer');
                if (userVal && userVal !== correctVal) {
                    const wrongBtn = document.querySelector(`[data-type="${key}"][data-value="${userVal}"]`);
                    if (wrongBtn) wrongBtn.classList.add('wrong-answer');
                }
            });
        }

        function endGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('progressContainer').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = Math.round(score);
            const percentage = FULL_MARKS > 0 ? Math.round((score / FULL_MARKS) * 100) : 0;
            document.getElementById('accuracy').textContent = percentage;
            let message = '', emoji = '';
            if (percentage >= 90) { message = '太棒了！你是會計大師！'; emoji = '👑'; } 
            else if (percentage >= 70) { message = '做得很好！基礎很紮實！'; emoji = '🌟'; } 
            else if (percentage >= 50) { message = '不錯！多練習會更熟練！'; emoji = '👍'; } 
            else { message = '繼續努力！建議複習基本概念。'; emoji = '📚'; }
            document.getElementById('performanceMessage').textContent = message;
            document.getElementById('endEmoji').textContent = emoji;
        }

        function restartGame() {
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        function showCustomAlert(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
            alertDiv.innerHTML = `<div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg max-w-sm w-full slide-in"><p class="text-gray-700 dark:text-gray-300 mb-6 text-lg font-medium text-center">${message}</p><button class="w-full px-4 py-3 bg-primary text-white hover:bg-purple-700 rounded-lg text-base font-semibold" onclick="this.closest('.fixed').remove()">確定</button></div>`;
            document.body.appendChild(alertDiv);
        }

        // *** THIS IS THE NEW EVENT HANDLING LOGIC ***
        document.addEventListener('DOMContentLoaded', () => {
            // Difficulty selection
            document.getElementById('difficulty-selection').addEventListener('click', (event) => {
                const btn = event.target.closest('.difficulty-btn');
                if (btn) {
                    selectDifficulty(btn.dataset.difficulty, btn);
                }
            });

            // Dynamic option buttons in the game
            document.getElementById('questionContainer').addEventListener('click', (event) => {
                const btn = event.target.closest('.option-btn');
                if (btn) {
                    selectOption(btn.dataset.type, btn.dataset.value, btn);
                }
            });

            // Static buttons
            document.getElementById('startGameBtn').addEventListener('click', startGame);
            document.getElementById('submitBtn').addEventListener('click', checkAnswer);
            document.getElementById('printBtn').addEventListener('click', () => window.print());
            document.getElementById('restartBtn').addEventListener('click', restartGame);
        });
    </script>
</body>
</html>
